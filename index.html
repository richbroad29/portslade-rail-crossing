<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F172A">
<title>Portslade Level Crossing — We've Moved</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0F172A;color:#E2E8F0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:400px;width:100%;text-align:center}
.icon{font-size:48px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
p{font-size:14px;color:#94A3B8;line-height:1.6;margin-bottom:20px}
.btn{display:inline-block;padding:14px 28px;border-radius:10px;background:#3B82F6;color:#FFF;font-size:15px;font-weight:600;text-decoration:none;transition:background .2s}
.btn:active{background:#2563EB}
.note{font-size:11px;color:#64748B;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🚚</div>
  <h1>We've moved!</h1>
  <p>The Portslade Level Crossing app has a new home with a fresh design, live closure predictions, and support for more crossings.</p>
  <a class="btn" href="https://richbroad29.github.io/rail-crossing/portslade/">Go to the new page</a>
  <p class="note">If you added this to your home screen, you'll need to re-add it from the new page to get the updated icon and URL.</p>
</div>
</body>
</html>
